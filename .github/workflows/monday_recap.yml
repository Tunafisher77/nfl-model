name: NFL Monday Recap

on:
  schedule:
    # 5:30 AM Pacific year-round (two UTC schedules, gated by local time).
    - cron: "30 12 * * 1"
    - cron: "30 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific run window
        id: pacific
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Los_Angeles date +%H)" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pacific.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.pacific.outputs.run == 'true'
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        if: steps.pacific.outputs.run == 'true'
      - run: python -m unittest discover -s tests -v
        if: steps.pacific.outputs.run == 'true'
      - name: Authenticate to Google Cloud
        if: steps.pacific.outputs.run == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/457900160143/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: mlb-hr-model@mlb-hr-model-498322.iam.gserviceaccount.com
      - name: Grade completed games and build recap
        if: steps.pacific.outputs.run == 'true'
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          python nfl_results_tracker.py
          python nfl_weekly_recap.py
